<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>冬季消防安全知识调查问卷</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
 * { margin:0; padding:0; box-sizing:border-box; }
 body { font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif; background:#f5f5f4; color:#333; -webkit-tap-highlight-color:transparent; }
 body.dark-shift { background:#141414; transition:background .4s; }

 /* ═══ 官方横幅 ═══ */
 .gov-banner { background:linear-gradient(180deg,#b71c1c,#c62828); color:#fff; text-align:center; padding:12px 10px; font-size:13px; letter-spacing:2px; }
 .gov-banner .b1 { font-size:12px; opacity:.9; margin-bottom:3px; }
 .gov-banner .b2 { font-size:15px; font-weight:800; }

 /* ═══ 红头标题 ═══ */
 .doc-head { text-align:center; padding:30px 16px 6px; }
 .doc-head h1 { font-size:24px; color:#b71c1c; font-weight:800; letter-spacing:2px; }
 .doc-head .doc-sub { font-size:12px; color:#777; margin-top:8px; }
 .doc-head .red-line { width:64px; height:3px; background:#b71c1c; margin:14px auto 0; border-radius:2px; }

 /* ═══ 问卷主体 ═══ */
 .survey { max-width:600px; margin:0 auto; padding:10px 14px 60px; }
 .start-card { background:#fff; border:1px solid #e0dedb; border-radius:10px; padding:30px 22px; margin-top:22px; text-align:center; }
 .start-card p { font-size:14px; line-height:2; color:#555; }
 .start-card .notice-line { margin-top:18px; font-size:11px; color:#b71c1c; border:1px dashed #e0a5a5; background:#fdf5f5; border-radius:8px; padding:10px 14px; line-height:1.8; }
 .btn-go { display:block; width:100%; max-width:280px; margin:22px auto 0; background:#c62828; color:#fff; border:none; border-radius:6px; padding:14px; font-size:16px; font-weight:700; letter-spacing:3px; cursor:pointer; font-family:inherit; }
 .btn-go:hover { background:#a01a1a; }
 .btn-go:active { transform:scale(.98); }
 .btn-submit { display:block; width:100%; max-width:280px; margin:22px auto 0; background:#c62828; color:#fff; border:none; border-radius:6px; padding:14px; font-size:15px; font-weight:700; letter-spacing:2px; cursor:pointer; font-family:inherit; }

 .q-card { background:#fff; border:1px solid #e0dedb; border-radius:10px; padding:22px 20px; margin-top:16px; box-shadow:0 1px 4px rgba(0,0,0,.04); }
 .q-card .q-meta { font-size:11px; color:#999; display:flex; justify-content:space-between; margin-bottom:10px; }
 .q-card .q-meta .q-type { color:#c62828; }
 .q-text { font-size:16px; font-weight:700; color:#222; line-height:1.7; margin-bottom:16px; }
 .q-opt { display:block; width:100%; text-align:left; background:#fafafa; border:1px solid #e3e1de; border-radius:6px; padding:12px 14px; margin-bottom:9px; font-size:14px; color:#333; cursor:pointer; transition:all .12s; font-family:inherit; }
 .q-opt:hover { border-color:#c62828; background:#fff5f5; }
 .q-opt:active { transform:scale(.98); }
 .q-opt .k { display:inline-block; width:20px; height:20px; line-height:20px; text-align:center; border-radius:4px; background:#eef1f5; color:#555; font-size:11px; margin-right:10px; font-weight:700; }
 .q-opt .t { font-family:inherit; }
 .q-opt .t.glitchy { color:#111; background:#0f0; font-family:monospace !important; }
 .q-opt .t.blood-red { color:#fecaca; }
 .q-opt.picked-red { background:#7f1d1d !important; border-color:#b91c1c !important; box-shadow:0 0 18px rgba(185,28,28,.55); animation:redJitter .3s ease; }
 @keyframes redJitter { 0%,100% { transform:translateX(0); } 25% { transform:translateX(-3px); } 75% { transform:translateX(3px); } }
 .q-opt.ghost-others { border-color:#5c2a2a; opacity:.75; animation:ghostTremble .25s ease; }
 @keyframes ghostTremble { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-2px); } }

 .progress { height:3px; background:#e6e4e1; margin-top:16px; overflow:hidden; border-radius:2px; }
 .progress .fill { height:100%; background:#c62828; width:0; transition:width .35s ease; border-radius:2px; }

 .gov-foot { text-align:center; font-size:10px; color:#aaa; padding:18px 10px 10px; letter-spacing:1px; line-height:1.9; }
 .gov-foot .warn-tiny { color:#b71c1c; font-size:10px; margin-top:6px; }

 /* ═══ 干扰层 ═══ */
 .glitch-line { position:fixed; left:8%; right:8%; bottom:22%; color:#ff4500; font-size:13px; font-family:monospace; display:none; z-index:9990; text-shadow:0 0 8px #ff4500; pointer-events:none; }
 .corner-msg { position:fixed; right:10px; bottom:10px; color:#b71c1c; font-size:11px; letter-spacing:2px; display:none; z-index:9990; font-style:italic; pointer-events:none; }
 .scanline { position:fixed; inset:0; display:none; z-index:9988; pointer-events:none; background:repeating-linear-gradient(0deg, rgba(0,0,0,.12) 0px, rgba(0,0,0,.12) 2px, transparent 2px, transparent 5px); animation:scanMove .3s linear infinite; }
 @keyframes scanMove { 0% { background-position:0 0; } 100% { background-position:0 8px; } }
 .noise { position:fixed; inset:0; display:none; z-index:9987; pointer-events:none; background:repeating-conic-gradient(#000 0% 25%, transparent 0% 50%) 0 0/3px 3px; opacity:.18; animation:noiseJ .15s steps(2) infinite; }
 @keyframes noiseJ { 0% { transform:translate(0,0); } 50% { transform:translate(1px,-1px); } 100% { transform:translate(-1px,1px); } }
 .flash-white { animation:whiteF .12s steps(1); }
 @keyframes whiteF { 0% { background:#fff !important; } 100% { background:#f5f5f4; } }
 .flash-black { animation:blackF .3s steps(1); }
 @keyframes blackF { 0% { background:#000; } 100% { background:#f5f5f4; } }
 .shake { animation:pgShake .4s ease; }
 @keyframes pgShake { 0%,100% { transform:translate(0,0); } 15% { transform:translate(-7px,3px); } 30% { transform:translate(6px,-4px); } 45% { transform:translate(-5px,-3px); } 60% { transform:translate(5px,4px); } 75% { transform:translate(-4px,2px); } 90% { transform:translate(3px,-3px); } }
 @keyframes rescueFlick { 0%,100% { opacity:1; } 50% { opacity:.15; } }
 .connect-bar { position:fixed; top:0; left:0; right:0; background:#d32f2f; color:#fff; font-size:12px; text-align:center; padding:7px; display:none; z-index:9991; letter-spacing:1px; }
 .red-flash { position:fixed; inset:0; display:none; z-index:9993; background:#000; align-items:center; justify-content:center; }
 .red-flash .rf-txt { font-size:56px; font-weight:900; color:#d32f2f; letter-spacing:8px; text-shadow:0 0 30px rgba(211,47,47,.8); }
 .red-flash .rf-txt2 { font-size:20px; color:#ff8a80; letter-spacing:4px; margin-top:14px; }

 /* ═══ 突脸层 ═══ */
 .scare-layer { position:fixed; inset:0; z-index:99999; display:none; background:#000; align-items:center; justify-content:center; overflow:hidden; }
 /* 背景图片：从屏幕中央放大弹出 */
 .scare-layer .scare-bg { position:absolute; inset:0; z-index:0; background-position:center center; background-size:cover; background-repeat:no-repeat; opacity:0; transform:scale(0); animation:scarePop .5s cubic-bezier(.15,.85,.35,1) forwards; }
 @keyframes scarePop {
  0%   { transform:scale(0);    opacity:0;   filter:blur(14px) brightness(.2) contrast(1.6); }
  45%  { transform:scale(1.25); opacity:.85; filter:blur(4px)  brightness(.45) contrast(1.3); }
  70%  { transform:scale(.95);  opacity:1;   filter:blur(1px)  brightness(.55) contrast(1.1); }
  100% { transform:scale(1);    opacity:1;   filter:blur(0)    brightness(.6)  contrast(1); }
 }
 /* 红色光晕叠加 */
 .scare-layer .scare-tint { position:absolute; inset:0; background:radial-gradient(ellipse at center, rgba(255,30,0,.35), transparent 70%); pointer-events:none; z-index:1; }
 /* 文字层：浮在背景上方，半透明 */
 .scare-layer .scare-text-overlay { position:relative; z-index:2; width:100%; height:100%; display:flex; align-items:center; justify-content:center; flex-direction:column; pointer-events:none; }
 .scare-layer .scare-text-overlay .scare-main { font-size:52px; font-weight:900; color:rgba(255,42,0,.75); letter-spacing:8px; margin-top:10px; text-shadow:0 0 30px rgba(255,0,0,.6),0 0 60px rgba(255,69,0,.4); animation:textFlicker .1s steps(2) infinite; }
 .scare-layer .scare-text-overlay .scare-sub  { font-size:20px; color:rgba(255,138,128,.7); margin-top:16px; letter-spacing:4px; text-shadow:0 0 12px rgba(255,0,0,.4); }

 body.scare-shake { animation:scareShake .28s linear infinite; }
 @keyframes scareShake { 0% { transform:translate(0,0); } 25% { transform:translate(-9px,6px); } 50% { transform:translate(8px,-7px); } 75% { transform:translate(-6px,-5px); } 100% { transform:translate(6px,7px); } }

 /* ═══ 收尾页 ═══ */
 .ending { max-width:600px; margin:0 auto; padding:60px 20px; text-align:center; color:#444; }
 .ending h2 { color:#b71c1c; font-size:21px; letter-spacing:2px; margin-bottom:16px; }
 .ending p { font-size:14px; line-height:2.2; color:#666; }
 .ending .tiny { font-size:11px; color:#999; margin-top:34px; font-style:italic; }
 .ending .btn-go { margin-top:30px; }
</style>
</head>
<body>

<!-- ═══ 官方横幅 ═══ -->
<div class="gov-banner">
  <div class="b1"><i class="fa-solid fa-fire"></i> 火锅店消防安全监察总局 <i class="fa-solid fa-fire"></i></div>
  <div class="b2">冬 季 防 火 安 全 专 项 调 查</div>
</div>

<div class="doc-head">
  <h1>冬季消防安全知识调查问卷</h1>
  <div class="doc-sub">冬季为火灾事故高发期 · 为保障生命财产安全 · 特开展本次专项调查</div>
  <div class="red-line"></div>
</div>

<div class="survey" id="survey">
  <!-- 由 JS 渲染 -->
</div>

<div class="gov-foot">
  本问卷由火锅店消防安全监察总局发布 · 数据仅用于安全教育统计 · 请勿中途退出
  <div class="warn-tiny"><i class="fa-solid fa-triangle-exclamation"></i> 提示：本问卷包含模拟恐怖元素，答题过程中如有不适请及时停止</div>
</div>

<!-- ═══ 干扰层 ═══ -->
<div class="connect-bar" id="connectBar"><i class="fa-solid fa-triangle-exclamation"></i> 连接中断 · 正在重新建立连接…</div>
<div class="glitch-line" id="glitchLine">‮ SYS.ERROE: smoke_detector＿is not responding · connection lost</div>
<div class="corner-msg" id="cornerMsg">烟还在飘吗……</div>
<div class="scanline" id="scanline"></div>
<div class="noise" id="noise"></div>
<div class="red-flash" id="redFlash"><div style="text-align:center;"><div class="rf-txt">火来了</div><div class="rf-txt2">别打开门</div></div></div>

<!-- ═══ 突脸层 ═══ -->
<div class="scare-layer" id="scareLayer">
  <div class="scare-bg" id="scareBg" style="background-image:url('./assets/scare_face.jpg');"></div>
  <div class="scare-tint"></div>
  <div class="scare-text-overlay" id="scareTextOverlay">
    <div class="scare-main">你 跑 不 掉 了</div>
    <div class="scare-sub">火 已 经 包 围 你 了</div>
  </div>
</div>

<script>
/* =============================================
   冬季消防安全知识调查问卷(伪装恐怖版 V1)
   17 题 · 四阶段渐进惊吓 · 独立官方UI
   剧本: 正常→小异常→明显异常→强刺激→突脸→收尾
   ============================================= */

var STORAGE_KEY = 'quiz_fire_v1';

var QUESTIONS = [
  /* ═══ 正常期 Q1-6 ═══ */
  { q: '发现火灾时，你应该首先做什么？', opts: ['立即冲进火场救人', '拨打119报警电话', '拍照发朋友圈', '自己尝试灭火'] },
  { q: '火灾黄金逃生时间是？', opts: ['30分钟', '2-3分钟', '10分钟', '看火势大小'] },
  { q: '火灾中致人死亡的主要原因是？', opts: ['被火烧死', '吸入有毒烟气窒息', '建筑物倒塌', '跳楼摔伤'] },
  { q: '发现楼道里有浓烟，你应该？', opts: ['乘电梯快速下楼', '用湿毛巾捂住口鼻弯腰逃生', '原地等待救援', '打开门窗通风'] },
  { q: '家中油锅起火了，正确的处理方式是？', opts: ['用水泼灭', '盖上锅盖隔绝空气', '用扇子扇风灭火', '继续炒菜不管它'] },
  { q: '你会在卧室给手机充电过夜吗？', opts: ['经常这样，没问题', '不会，充电时无人看管有隐患', '偶尔会', '放在枕头下面充更快'] },

  /* ═══ 过渡期 Q7-11 ═══ */
  { q: '灭火器应该如何使用？', opts: ['对准火焰根部喷射', '对准火焰顶部喷', '随便喷就行', '把灭火器扔进火里'] },
  { q: '被困火场无法逃生时，应该？', opts: ['从窗户跳下', '用湿布堵住门缝，到窗口呼救', '躲进衣柜里', '继续在房间里走动'] },
  { q: '家中没人时，下列做法正确的是？', opts: ['关闭所有电器电源', '让电视开着当背景音', '电暖器开最大档取暖', '充电器一直插着'] },
  { q: '冬季使用电暖器需要注意什么？', opts: ['可以在上面烘干衣物', '远离可燃物，人走断电', '睡觉时一直开着', '用毛巾盖住散热口'] },
  { q: '闻到燃气泄漏的味道，你应该？', opts: ['立即开灯检查', '打开抽油烟机排气', '关闭阀门，开窗通风，不动电器', '用打火机找漏点'] },

  /* ═══ 诡异期 Q12-17 ═══ */
  { q: '刚才那阵烟味……好像不是从厨房来的？', opts: ['检查一下就好', '先跑再说', '回头看了一眼', '假装没闻到'] },
  { q: '你在火里待了多久了？', opts: ['我不在火里', '感觉很久了', '我怎么知道', '火好暖和'] },
  { q: '刚才那些题……是谁在答？', opts: ['我自己', '应该是我', '也可能是它', '别问了'] },
  { q: '火说你属于它了，你觉得？', opts: ['怎么可能', '有点害怕', '它认错人了', '我确实很熟悉火'] },
  { q: '你确定自己已经逃出来了吗？', opts: ['确定', '不确定', '我在哪', '它说还没烧完'] },
  { q: '要不要留下来陪火再暖一会儿？', opts: ['不，我要走', '别问我', '它来了', '……好'] },
  { q: '火在等你……你准备好了吗？', opts: ['准备好了', '没有', '它就在门后面', '烟好呛'] }
];

var idx = 0;
var finished = false;
var audioCtx = null, humOsc = null;

/* ── 手势内解锁 AudioContext(浏览器自动播放策略) ── */
function unlockAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch(e) {}
}

/* ── 低频嗡鸣(三振荡器 110+165+220Hz, 异步启动保证可听) ── */
function humStart() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    var doStart = function() {
      if (humOsc) return;
      var g = audioCtx.createGain();
      g.gain.value = 0.0001;
      g.gain.exponentialRampToValueAtTime(0.16, audioCtx.currentTime + 0.25);
      humOsc = audioCtx.createOscillator();
      humOsc.type = 'sine';
      humOsc.frequency.value = 110;
      var g2 = audioCtx.createGain();
      g2.gain.value = 0.08;
      var osc2 = audioCtx.createOscillator();
      osc2.type = 'sine';
      osc2.frequency.value = 165;
      var g3 = audioCtx.createGain();
      g3.gain.value = 0.08;
      var osc3 = audioCtx.createOscillator();
      osc3.type = 'sine';
      osc3.frequency.value = 220;
      humOsc.connect(g);
      osc2.connect(g2);
      osc3.connect(g3);
      g.connect(audioCtx.destination);
      g2.connect(audioCtx.destination);
      g3.connect(audioCtx.destination);
      humOsc.start();
      osc2.start();
      osc3.start();
      humOsc._second = osc2;
      humOsc._third = osc3;
    };
    if (audioCtx.state === 'running') { doStart(); return; }
    audioCtx.resume().then(doStart).catch(function(){});
  } catch(e) {}
}
function humStop() {
  try {
    if (humOsc) {
      humOsc.stop();
      if (humOsc._second) humOsc._second.stop();
      if (humOsc._third) humOsc._third.stop();
      humOsc = null;
    }
  } catch(e) {}
}

/* ── 渲染 ── */
function render() {
  var s = document.getElementById('survey');

  /* 提交页 */
  if (idx >= QUESTIONS.length) {
    s.innerHTML =
      '<div class="q-card">'+
        '<div class="q-meta"><span>第 '+(QUESTIONS.length+1)+' / '+(QUESTIONS.length+1)+' 题</span><span class="q-type">提交确认</span></div>'+
        '<div class="q-text">以上便是全部题目。<br>确认无误后，请提交答卷。</div>'+
        '<button class="btn-submit" onclick="doSubmit()"><i class="fa-solid fa-paper-plane"></i> 提交答卷</button>'+
      '</div>';
    return;
  }

  var q = QUESTIONS[idx];
  var pct = Math.round(idx / QUESTIONS.length * 100);
  var html =
    '<div class="progress"><div class="fill" id="progFill" style="width:'+pct+'%"></div></div>'+
    '<div class="q-card">'+
      '<div class="q-meta"><span>第 '+(idx+1)+' / '+(QUESTIONS.length+1)+' 题</span><span class="q-type">单选题 · 共4项</span></div>'+
      '<div class="q-text" id="qText">'+q.q+'</div>'+
      '<div id="optList">';
  for (var i = 0; i < q.opts.length; i++) {
    html += '<button class="q-opt" onclick="answer('+i+',this)"><span class="k">'+'ABCD'[i]+'</span><span class="t">'+q.opts[i]+'</span></button>';
  }
  html += '</div></div>';
  s.innerHTML = html;
  runStageEvent(idx);
}

/* ── 答题 ── */
function answer(i, btn) {
  if (finished) return;
  unlockAudio();

  /* 选后变红(仅选中项) + 闪烁 */
  var holdMs = [350, 500, 650, 800][Math.min(Math.floor(idx / 5), 3)];
  pickedRed(btn, i);

  /* Q12起(idx>=11): 被操控 — 玩家选的被夺舍, 系统强制选中随机选项 */
  if (idx >= 11) {
    holdMs = 500;
    setTimeout(function() {
      var opts = document.querySelectorAll('.q-opt');
      if (opts.length) {
        if (btn) {
          btn.classList.remove('picked-red');
          var t0 = btn.querySelector('.t');
          if (t0) t0.classList.remove('blood-red');
        }
        var sys = opts[Math.floor(Math.random() * opts.length)];
        sys.classList.add('picked-red');
        var t1 = sys.querySelector('.t');
        if (t1) t1.classList.add('blood-red');
      }
    }, 120);
  }

  setTimeout(function() {
    idx++;
    localStorage.setItem(STORAGE_KEY, 'q' + idx);
    if (idx === QUESTIONS.length) { renderFire(); return; }
    if (idx >= QUESTIONS.length + 1) { doSubmit(); return; }
    var delay = 250;
    if (idx === 1) delay = 800;
    setTimeout(render, delay);
  }, holdMs);
}

/* ── 选中项变血红 + 闪烁(其他选项不动) ── */
function pickedRed(btn, pickedIdx) {
  var opts = document.querySelectorAll('.q-opt');
  for (var i = 0; i < opts.length; i++) {
    if (opts[i] === btn) {
      opts[i].classList.add('picked-red');
      var t = opts[i].querySelector('.t');
      if (t) t.classList.add('blood-red');
    } else {
      opts[i].setAttribute('onclick', 'return false;');
    }
  }
}

/* ── 火之页: 全部文字变成整行整行的"焱" ── */
function renderFire() {
  humStart();
  var saved = [];
  var nodes = [];
  var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {
    acceptNode: function(n) {
      var tag = n.parentNode ? n.parentNode.tagName : '';
      if (tag === 'SCRIPT' || tag === 'STYLE' || tag === 'NOSCRIPT') return NodeFilter.FILTER_REJECT;
      if (n.textContent.trim()) return NodeFilter.FILTER_ACCEPT;
      return NodeFilter.FILTER_REJECT;
    }
  });
  while (walker.nextNode()) {
    nodes.push(walker.currentNode);
    saved.push(walker.currentNode.textContent);
  }
  /* 每个文本节点 → 一整行"焱"(数量按原文字长度缩放, 最少10个) */
  for (var i = 0; i < nodes.length; i++) {
    var count = Math.max(10, Math.round(saved[i].length * 3));
    nodes[i].textContent = Array(count + 1).join('焱');
  }

  setTimeout(function() {
    /* 黑屏闪断 80ms */
    var bk = document.createElement('div');
    bk.style.cssText = 'position:fixed;inset:0;background:#000;z-index:9999;';
    document.body.appendChild(bk);
    setTimeout(function() {
      if (bk.parentNode) bk.parentNode.removeChild(bk);
      for (var j = 0; j < nodes.length; j++) nodes[j].textContent = saved[j];
      humStop();
      render();
    }, 80);
  }, 1200);
}

/* ── 阶段事件(17题版, 渐进崩坏) ── */
function runStageEvent(n) {
  switch (n) {
    case 2: glitchFlash(); break;                    // Q3 轻乱码
    case 4: whiteFlashShadow(); break;               // Q6 白屏+阴影一闪
    case 5: titleWarp(); break;                      // Q7 标题"火"→"煷"(永久)
    case 6: blackWhyBox(); break;                    // Q8 纯黑框"为什么?"
    case 7: scanlineFire(); break;                   // Q9 扫描线+火焰轮廓
    case 8: darkShiftAndBar(); break;                // Q10 变暗+断连条
    case 9: whiteRescue(); break;                    // Q11 全白+倒写红字"救救我"
    case 10: progressWarp(); break;                  // Q12 进度倒退
    case 11: titleLostWen(); break;                  // Q13 标题"问"字消失(永久)
    case 12: titleGlitchAll(); break;                // Q14 标题整行乱码+黑屏红字
    case 13: break;                                  // Q15 (无专属事件)
    case 14: optChaos(); break;                      // Q16 选项错乱+强震
    case 15: titleComeInFire(); break;               // Q17 标题变"来火里吧"(永久)+嗡鸣
  }
  /* Q10 起 汉字重复崩坏(随机触发) */
  if (n >= 9 && n <= 15) {
    var p = 0.4;
    if (n >= 11) p = 0.6;
    if (n >= 13) p = 0.8;
    if (Math.random() < p) repeatGlitch();
  }
}

/* ── 汉字重复崩坏: 标题或随机选项文字中抽1个汉字重复 ── */
function repeatGlitch() {
  var targets = [];
  var h1 = document.querySelector('.doc-head h1');
  if (h1) targets.push({ el: h1, restore: h1.textContent });
  var opts = document.querySelectorAll('.q-opt .t');
  for (var i = 0; i < opts.length; i++) {
    targets.push({ el: opts[i], restore: opts[i].textContent });
  }
  if (!targets.length) return;

  var pick = targets[Math.floor(Math.random() * targets.length)];
  var txt = pick.restore;
  var chars = txt.match(/[\u4e00-\u9fa5]/g);
  if (!chars || !chars.length) return;
  var rep = chars[Math.floor(Math.random() * chars.length)];
  var count = 8 + Math.floor(Math.random() * 8);
  pick.el.textContent = txt.replace(rep, new Array(count + 1).join(rep));
  setTimeout(function() {
    pick.el.textContent = pick.restore;
  }, 500);
}

/* Q3: 底部乱码一闪 */
function glitchFlash() {
  var g = document.getElementById('glitchLine');
  g.style.display = 'block';
  setTimeout(function(){ g.style.display = 'none'; }, 90);
}

/* Q6: 白屏闪烁 + 极暗阴影图一闪 */
function whiteFlashShadow() {
  var ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;background:#fff;z-index:9994;';
  ov.innerHTML = '<div style="position:absolute;inset:0;background:radial-gradient(circle at 50% 60%,rgba(255,60,0,.08),transparent 70%);"></div>';
  document.body.appendChild(ov);
  setTimeout(function(){ if (ov.parentNode) ov.parentNode.removeChild(ov); }, 140);
}

/* Q7: 标题"火"→"煷"(永久异变) */
function titleWarp() {
  var h1 = document.querySelector('.doc-head h1');
  if (h1) h1.textContent = h1.textContent.replace('火', '煷');
}

/* Q8: 纯黑提示框, 小字"为什么?"铺满全屏 */
function blackWhyBox() {
  var fe = document.createElement('div');
  fe.style.cssText = 'position:fixed;inset:0;background:#000;z-index:9994;overflow:hidden;';
  var rows = '';
  for (var i = 0; i < 30; i++) {
    var size = 18 + Math.floor(Math.random() * 14);
    var rot = Math.floor(Math.random() * 40) - 20;
    var top = Math.floor(Math.random() * 96);
    var left = Math.floor(Math.random() * 92);
    var fade = 0.4 + Math.random() * 0.6;
    rows += '<div style="position:absolute;top:'+top+'%;left:'+left+'%;color:#ff4500;font-size:'+size+'px;font-weight:900;transform:rotate('+rot+'deg);opacity:'+fade+';text-shadow:0 0 18px rgba(255,69,0,.8);white-space:nowrap;">为什么？</div>';
  }
  fe.innerHTML = rows;
  document.body.appendChild(fe);
  setTimeout(function(){
    fe.style.transition = 'opacity .3s';
    fe.style.opacity = '0';
  }, 500);
  setTimeout(function(){ if (fe.parentNode) fe.parentNode.removeChild(fe); }, 850);
}

/* Q9: 扫描线 + 下方隐约火焰轮廓 */
function scanlineFire() {
  var sl = document.getElementById('scanline');
  sl.style.display = 'block';
  humStart();
  var ghost = document.createElement('div');
  ghost.style.cssText = 'position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:9988;pointer-events:none;';
  ghost.innerHTML = '<div style="width:200px;height:260px;background:radial-gradient(ellipse at 50% 100%,rgba(255,80,0,.12),transparent 70%);filter:blur(4px);"></div>';
  document.body.appendChild(ghost);
  setTimeout(function(){
    sl.style.display = 'none';
    humStop();
    if (ghost.parentNode) ghost.parentNode.removeChild(ghost);
  }, 800);
}

/* Q10: 背景变暗 */
function darkShiftAndBar() {
  document.body.classList.add('dark-shift');
}

/* Q11: 全白 + 倒写红字"救救我"逐行铺满全屏 */
function whiteRescue() {
  var ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;background:#fff;z-index:9995;overflow:hidden;';
  var html = '';
  var ROWS = 14;
  for (var r = 0; r < ROWS; r++) {
    var line = '';
    var n = 4 + Math.floor(Math.random() * 5);
    for (var i = 0; i < n; i++) line += '救救我';
    var rot = (Math.random() * 6) - 3;
    var size = 20 + Math.floor(Math.random() * 6);
    var color = Math.random() < 0.3 ? '#8a1f1f' : '#d32f2f';
    var delay = Math.random() * 0.1;
    var left = Math.random() * 10;
    html += '<div style="position:absolute;top:'+(r/ROWS*100)+'%;left:'+left+'%;right:0;white-space:nowrap;transform:rotate('+rot+'deg);color:'+color+';font-size:'+size+'px;font-weight:900;letter-spacing:3px;line-height:1.15;text-shadow:0 0 18px rgba(211,47,47,.7);animation:rescueFlick .15s steps(2) infinite;animation-delay:'+delay+'s;">'+line+'</div>';
  }
  ov.innerHTML = html;
  document.body.appendChild(ov);
  setTimeout(function(){
    ov.style.transition = 'opacity .3s';
    ov.style.opacity = '0';
  }, 700);
  setTimeout(function(){ if (ov.parentNode) ov.parentNode.removeChild(ov); }, 1050);
  var cm = document.getElementById('cornerMsg');
  cm.style.display = 'block';
  setTimeout(function(){ cm.style.display = 'none'; }, 3000);
}

/* Q12: 进度倒退 */
function progressWarp() {
  var fill = document.getElementById('progFill');
  if (fill) {
    var cur = fill.style.width;
    fill.style.transition = 'none';
    fill.style.width = Math.round(parseFloat(cur) * 0.55) + '%';
    setTimeout(function(){
      fill.style.transition = 'width .4s ease';
      fill.style.width = cur;
    }, 150);
  }
}

/* Q13: 标题"问"字消失(永久) */
function titleLostWen() {
  var h1 = document.querySelector('.doc-head h1');
  if (h1) h1.textContent = h1.textContent.replace(/问/g, '');
}

/* Q14: 标题真乱码, 闪烁3次 */
function titleGlitchAll() {
  var h1 = document.querySelector('.doc-head h1');
  if (h1) {
    var cur = h1.textContent;
    var glitchChars = '̸̸ΞΣΔΨΞΞΔΨ▓▒░ϝϞϟϢЖΦΨΞΞΣΞ̸̸̸̸';
    var blink = 0;
    var timer = setInterval(function() {
      blink++;
      if (blink % 2 === 1) {
        h1.textContent = glitchChars;
        h1.style.color = '#ff4500';
        h1.style.textShadow = '0 0 14px rgba(255,69,0,.7)';
      } else {
        h1.textContent = cur;
        h1.style.color = '';
        h1.style.textShadow = '';
      }
      if (blink >= 6) {
        clearInterval(timer);
        h1.textContent = cur;
        h1.style.color = '';
        h1.style.textShadow = '';
      }
    }, 60);
  }
}

/* Q16: 所有选项文字错乱交换 + 强震 */
function optChaos() {
  var texts = document.querySelectorAll('.q-opt .t');
  if (texts.length >= 2) {
    var arr = Array.prototype.slice.call(texts).map(function(t){ return t.textContent; });
    var orig = arr.slice();
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    for (var k = 0; k < texts.length; k++) texts[k].textContent = arr[k];
    setTimeout(function(){
      for (var m = 0; m < texts.length; m++) texts[m].textContent = orig[m];
    }, 900);
  }
  shakePage();
  humStart();
  setTimeout(humStop, 600);
}

/* Q17: 标题变"来火里吧"(永久) + 嗡鸣持续 */
function titleComeInFire() {
  var h1 = document.querySelector('.doc-head h1');
  if (h1) h1.textContent = '来火里吧';
  humStart();
  setTimeout(humStop, 3000);
}

function shakePage() {
  var s = document.getElementById('survey');
  s.classList.remove('shake');
  void s.offsetWidth;
  s.classList.add('shake');
  setTimeout(function(){ s.classList.remove('shake'); }, 500);
}

/* ── 提交 → 突脸序列 ── */
function doSubmit() {
  if (finished) return;
  finished = true;
  localStorage.setItem(STORAGE_KEY, 'done');
  humStop();

  var s = document.getElementById('survey');
  s.innerHTML =
    '<div class="q-card" style="text-align:center;">'+
      '<div class="q-text">正在提交答卷…</div>'+
      '<p id="submitState" style="font-size:13px;color:#777;margin-top:10px;">正在加密上传答题数据…</p>'+
    '</div>';

  var states = ['正在校验答案…', '正在核对答题记录…', '正在检查你是否真的在答题…', '正在验证身份…'];
  var si = 0;
  var st = setInterval(function(){
    var el = document.getElementById('submitState');
    if (el && si < states.length) el.textContent = states[si++];
  }, 650);

  /* 时序: 雪花屏 → 全黑 → 突脸 → 收尾 */
  setTimeout(function(){
    humStart();
    var noise = document.getElementById('noise');
    noise.style.opacity = '0.6';
    noise.style.display = 'block';
    noise.style.animationDuration = '0.07s';
  }, 1400);
  setTimeout(function(){
    var noise = document.getElementById('noise');
    noise.style.display = 'none';
    var bk = document.createElement('div');
    bk.id = 'preBlack';
    bk.style.cssText = 'position:fixed;inset:0;background:#000;z-index:99998;';
    document.body.appendChild(bk);
  }, 1750);

  /* ═══ 突脸！═══ */
  setTimeout(function(){
    clearInterval(st);
    humStop();
    var pb = document.getElementById('preBlack');
    if (pb && pb.parentNode) pb.parentNode.removeChild(pb);

    /* 播放外部尖叫音效 */
    playScareAudio();

    /* 显示突脸层 — 背景图从中央放大弹出 + 半透明文字浮于上方 */
    var scareLayer = document.getElementById('scareLayer');
    scareLayer.style.display = 'flex';
    document.body.classList.add('scare-shake');

    /* 触发背景图放大动画: 先重置再添加，确保每次进入都重播 */
    var bg = document.getElementById('scareBg');
    if (bg) {
      bg.style.animation = 'none';
      void bg.offsetWidth; /* reflow */
      bg.style.animation = '';
    }

    /* 动态注入 textFlicker 关键帧（仅一次） */
    if (!document.getElementById('textFlickerStyle')) {
      var flick = document.createElement('style');
      flick.id = 'textFlickerStyle';
      flick.textContent = '@keyframes textFlicker { 0%{opacity:1;} 50%{opacity:.3;} 100%{opacity:1;} }';
      document.head.appendChild(flick);
    }

  }, 2300);

  /* 突脸持续2秒后进入收尾 */
  setTimeout(function(){
    var scareLayer = document.getElementById('scareLayer');
    if (scareLayer) {
      scareLayer.style.transition = 'opacity .5s';
      scareLayer.style.opacity = '0';
    }
    document.body.classList.remove('scare-shake');
    stopScareAudio();
  }, 4300);

  setTimeout(function(){
    var scareLayer = document.getElementById('scareLayer');
    if (scareLayer) {
      scareLayer.style.display = 'none';
      scareLayer.style.opacity = '';
    }
    renderEnding();
  }, 4900);
}

/* ── 外部音效播放(./assets/scare_scream.ogg) ── */
var scareAudio = null;
function playScareAudio() {
  try {
    stopScareAudio();
    scareAudio = new Audio('./assets/scare_scream.ogg');
    scareAudio.volume = 1.0;
    scareAudio.play().catch(function(err){ console.log('scare audio play failed:', err); });
  } catch(e) { console.log('scare audio failed:', e); }
}
function stopScareAudio() {
  try {
    if (scareAudio) {
      scareAudio.pause();
      scareAudio.currentTime = 0;
      scareAudio = null;
    }
  } catch(e) {}
}

/* ── 收尾页 ── */
function renderEnding() {
  var s = document.getElementById('survey');
  s.innerHTML =
    '<div class="ending">'+
      '<h2><i class="fa-solid fa-circle-check" style="color:#4caf50;"></i> 问卷提交成功</h2>'+
      '<p>恭喜你完成了消防安全调查。<br>刚才出现的所有异常画面、乱码与声音<br>均为<b>模拟效果</b>，请不必惊慌。</p>'+
      '<p>真实的火灾危险远比刚才的惊吓严重：<br>火灾中<b>有毒烟气</b>可在数分钟内致人昏迷，<br>请定期检查家中电器线路，配备灭火器与烟感报警器。</p>'+
      '<p>冬季取暖请注意通风，人走断电。<br>发现火情，请立即拨打 <b>119</b>。</p>'+
      '<p>珍爱生命，远离火患。</p>'+
      '<button class="btn-go" onclick="restartSurvey()"><i class="fa-solid fa-rotate"></i> 重新测试</button>'+
      '<div class="tiny">火焰中的影子从未消散……<br>你确定……刚才的一切，真的只是模拟吗？</div>'+
      '<div style="margin-top:40px;padding-top:16px;border-top:1px solid #e0e0e0;font-size:11px;color:#bbb;line-height:1.8;">'+
        '本互动页面改编自 <b style="color:#999;">雾雨魔法店</b> 原作的防溺水恐怖问卷模板<br>'+
        '消防安全版本由 AI 协助改编重制 · 仅供娱乐<br>'+
        '<b style="color:#f0c060;">原作者：<a href="https://space.bilibili.com/1029138222" target="_blank" rel="noopener noreferrer" style="color:#f0c060;text-decoration:none;border-bottom:1px dashed #f0c060;">雾雨魔法店（bilibili UID: 1029138222）</a></b><br>'+
        '<b style="color:#f0c060;">原作品链接：<a href="https://www.azureflame.cloud/quiz-drowning.html" target="_blank" rel="noopener noreferrer" style="color:#f0c060;text-decoration:none;border-bottom:1px dashed #f0c060;">暑期防溺水安全知识调查问卷 <i class="fa-solid fa-up-right-from-square" style="font-size:9px;"></i></a></b>'+
      '</div>'+
    '</div>';
  document.getElementById('scareLayer').style.display = 'none';
  document.body.classList.remove('scare-shake');
  document.body.classList.remove('dark-shift');
}

/* ── 重新测试: 清除存档回起始页 ── */
function restartSurvey() {
  localStorage.removeItem(STORAGE_KEY);
  document.getElementById('connectBar').style.display = 'none';
  document.getElementById('scanline').style.display = 'none';
  document.getElementById('glitchLine').style.display = 'none';
  document.getElementById('cornerMsg').style.display = 'none';
  document.getElementById('noise').style.display = 'none';
  document.getElementById('noise').style.opacity = '0.18';
  var pb = document.getElementById('preBlack');
  if (pb && pb.parentNode) pb.parentNode.removeChild(pb);
  /* 清理突脸层 */
  var sl = document.getElementById('scareLayer');
  if (sl) {
    sl.style.display = 'none';
    sl.style.opacity = '';
    var bg = document.getElementById('scareBg');
    if (bg) { bg.style.animation = 'none'; bg.style.opacity = ''; bg.style.transform = ''; }
  }
  stopScareAudio();
  document.body.classList.remove('dark-shift');
  document.body.classList.remove('scare-shake');
  document.body.classList.remove('flash-white');
  humStop();
  idx = 0;
  renderStart();
}

/* ── 起始页渲染 ── */
function renderStart() {
  var s = document.getElementById('survey');
  s.innerHTML =
    '<div class="start-card">'+
      '<p style="font-size:15px;font-weight:700;color:#222;">尊敬的答题人：</p>'+
      '<p>冬季是火灾事故高发期，为提高消防安全意识，<br>请您在<b>30 秒</b>内完成本问卷全部题目。</p>'+
      '<p style="font-size:12px;color:#888;margin-top:8px;">本问卷共 '+(QUESTIONS.length+1)+' 题 · 单选 · 全部必答</p>'+
      '<div class="notice-line"><i class="fa-solid fa-triangle-exclamation"></i> 温馨提示：本问卷包含<b>模拟恐怖元素</b>（惊吓画面、突发音效），<br>答题过程中如感不适，请立即停止作答。</div>'+
      '<button class="btn-go" onclick="beginSurvey()">开始调查 <i class="fa-solid fa-arrow-right"></i></button>'+
    '</div>';
}

/* ── 恐怖内容警告: 点击开始时弹出, 同意后记住 ── */
function warnGo(go) {
  var agreed = false;
  try { agreed = localStorage.getItem('fire_horror_warn') === '1'; } catch (e) {}
  if (agreed) { go(); return; }
  var mask = document.createElement('div');
  mask.id = 'fireWarn';
  mask.style.cssText = 'position:fixed;inset:0;z-index:999999;background:rgba(8,5,10,.96);display:flex;align-items:center;justify-content:center;padding:20px;';
  mask.innerHTML =
    '<div style="max-width:400px;width:100%;background:#1a0e0e;border:1px solid #3a1f1f;border-radius:20px;padding:26px 22px;text-align:center;position:relative;overflow:hidden;">' +
    '<div style="position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#ff4500,#f0c060,#ff4500);"></div>' +
    '<div style="font-size:44px;margin-bottom:10px;color:#ff4500;"><i class="fa-solid fa-fire-flame-curved"></i></div>' +
    '<div style="font-size:19px;font-weight:900;color:#ff4500;letter-spacing:2px;margin-bottom:12px;">内容警告</div>' +
    '<div style="font-size:13px;color:#e0d8ec;line-height:1.9;text-align:left;margin-bottom:16px;">' +
    '本问卷包含 <b style="color:#f0c060;">模拟恐怖</b> 与 <b style="color:#f0c060;">跳脸惊吓</b> 效果，可能引起不适。<br><br>' +
    '心脏病、胆小或心理承受能力较弱者，请勿进入。<br><br>' +
    '无法接受者，请立即退出本页面。</div>' +
    '<button id="fireWarnOk" style="width:100%;border:none;border-radius:12px;padding:13px 0;font-size:15px;font-weight:800;background:linear-gradient(135deg,#ff4500,#d9a84a);color:#1a0e0e;cursor:pointer;font-family:inherit;">我已了解，开始</button>' +
    '<div style="font-size:10px;color:#8a7e9a;margin-top:10px;">火锅店消防安全监察总局 · 温馨提示</div>';
  document.body.appendChild(mask);
  document.getElementById('fireWarnOk').addEventListener('click', function() {
    try { localStorage.setItem('fire_horror_warn', '1'); } catch (e) {}
    mask.remove();
    go();
  });
}

function beginSurvey() {
  warnGo(function() {
    unlockAudio();
    idx = 0;
    localStorage.setItem(STORAGE_KEY, 'q0');
    render();
  });
}

/* ── 初始化: 直接进入起始页 ── */
(function() {
  renderStart();
})();
