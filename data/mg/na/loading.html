<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Irminsul</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
    --bg-color: #1a1a1a;
    --panel: #2b2b2b;
    --border: #444;
    --text: #e0e0e0;
    --accent: #3b8526;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: var(--bg-color);
    color: var(--text);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.container {
    width: 600px;
    min-height: 400px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 40px;
}

.header {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 20px;
    letter-spacing: 0.5px;
}

.content {
    font-size: 14px;
    line-height: 1.8;
    color: #aaa;
}

/* 防偷看 */
.hidden {
    display: none;
}
</style>
</head>

<body class="hidden">

<div class="container">
    <div class="header">🌿 Irminsul Terminal</div>
    <div class="content">
        <p>主界面内容区域。</p>
        <p>当前状态：已通过验证。</p>
        <p>后续内容将在此处渲染。</p>
        <p>请勿直接访问此路径。</p>
    </div>
</div>

<script>
(function () {
    const params = new URLSearchParams(location.search);
    const payload = params.get('_');

    // 基础格式校验
    if (!payload) {
        location.replace('/login.html');
        return;
    }

    let token, timestamp;

    try {
        const decoded = atob(payload);
        [token, timestamp] = decoded.split('.');
    } catch (e) {
        location.replace('/login.html');
        return;
    }

    // Token 格式校验
    if (
        !token ||
        !timestamp ||
        token.length !== 16 ||
        !/^[a-zA-Z0-9]+$/.test(token)
    ) {
        location.replace('/login.html');
        return;
    }

    // 时间戳校验（60秒有效）
    const now = Date.now();
    const ts = Number(timestamp);
    if (isNaN(ts) || now - ts > 60000) {
        sessionStorage.clear();
        location.replace('/login.html');
        return;
    }

    // sessionStorage 校验（一次性）
    const storedToken = sessionStorage.getItem('irminsul_token');
    const storedTs = sessionStorage.getItem('irminsul_ts');

    if (
        storedToken !== token ||
        storedTs !== timestamp
    ) {
        sessionStorage.clear();
        location.replace('/login.html');
        return;
    }

    // ✅ 校验通过
    document.body.classList.remove('hidden');
})();
</script>

</body>
</html>
