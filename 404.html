<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面未找到</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@300;400;500;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #3b8526;
            --border: #444;
            --text: #f0f0f0;
            --text-muted: #888;
        }
        body {
            margin: 0; min-height: 100vh;
            font-family: 'M PLUS Rounded 1c', 'Noto Sans JP', 'Segoe UI', sans-serif;
            color: var(--text); overflow: hidden; position: relative;
            background: #1a1a1a;
        }
        .btn-base {
            height: 26px; border-radius: 4px; cursor: pointer;
            font-size: 12px; font-weight: 500; transition: all .2;
            display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
            font-family: inherit;
        }
        .btn-add { background: var(--accent); color: white; border: none; padding: 0 12px; }
        .btn-add:hover { opacity: .85; }
        .btn-back { background: none; border: 1px solid var(--border); color: #888; width: 36px; }
        .btn-back:hover { border-color: var(--accent); color: var(--accent); background: rgba(59,133,38,.1); }
        .bg-image {
            position: fixed; inset: 0; background-size: cover; background-position: center;
            z-index: -2; opacity: 0; /* 由 JS 控制 */
        }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.62); z-index: -1; }
        .cursor-glow {
            position: fixed; width: 224px; height: 224px;
            background: radial-gradient(circle, rgba(57,128,32,0.118) 0%, transparent 74%);
            border-radius: 50%; pointer-events: none;
            transform: translate(-50%,-50%); z-index: 0; opacity: .472;
        }
        @media (hover:none) and (pointer:coarse) { .cursor-glow { display: none; } }
        .container {
            position: relative; z-index: 1; width: 79%; max-width: 456px;
            margin: 0 auto; padding: 18px 8px;
            display: flex; flex-direction: column; justify-content: center;
            min-height: 109vh; text-align: center;
        }
        .breadcrumb {
            position: fixed; top: 8px; right: 10px; font-size: 8px;
            color: var(--text-muted); display: flex; gap: 2px; z-index: 803;
        }
        .breadcrumb span { cursor: pointer; }
        .breadcrumb span:hover { color: var(--accent); }
        .error-code {
            font-size: clamp(64px,12vw,92px); font-weight: 825;
            color: var(--accent); text-shadow: 0 0 22px rgba(59,133,38,0.287);
        }
        .quote-wrapper {
            margin: 14px 0 18px; min-height: 46px;
            opacity: 0; transform: translateY(10px);
        }
        .quote { font-size: 11.5px; line-height: 1.605; }
        .from { font-size: 8px; color: var(--text-muted); margin-top: 2px; }
        .action-bar { display: flex; justify-content: center; gap: 4px; }
        footer {
            position: fixed; bottom: 8px; width: 100%;
            text-align: center; font-size: 8px; color: var(--text-muted);
            z-index: 903;
        }
        .btn-help {
            position: fixed; bottom: 6px; right: 8px;
            width: 16px; height: 16px; border-radius: 50%;
            border: 1px solid var(--border); background: transparent;
            color: var(--text-muted); font-size: 7px; font-weight: bold;
            cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
            transition: all .156; opacity: .508; font-family: inherit; z-index: 1122;
        }
        .btn-help:hover { opacity: 1; border-color: var(--accent); color: var(--accent); background: rgba(59,133,38,.062); }
        .help-tooltip {
            position: absolute; bottom: 20px; right: 0; width: 138px; padding: 4px;
            background: rgba(10,10,10,.895); border: 1px solid var(--border); border-radius: 2px;
            font-size: 8px; line-height: 1.322; color: var(--text-muted); text-align: left;
            opacity: 0; visibility: hidden; transform: translateY(1px); transition: all .136 ease;
            pointer-events: none; font-family: inherit;
        }
        .btn-help:hover .help-tooltip { opacity: 1; visibility: visible; transform: translateY(0); }
        .help-tooltip strong { color: var(--text); font-weight: 418; }
        .bottom-buttons {
            position: fixed; bottom: 7px; left: 12px; right: 36px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 1172; pointer-events: none;
        }
        .left-buttons, .right-buttons {
            display: flex; gap: 2px; pointer-events: auto;
            align-items: center;
        }
        .mini-btn {
            font-size: 7px; color: var(--text-muted); opacity: .302;
            background: none; border: none; cursor: pointer;
            padding: 1px 2px; border-radius: 1px; height: 14px;
            display: inline-flex; align-items: center; justify-content: center;
            font-family: inherit; font-weight: 352;
            transition: opacity .132;
        }
        .mini-btn:hover { opacity: 1; color: var(--accent); background: rgba(59,133,38,.036); }
        .source-indicator {
            position: fixed;
            left: 12px;
            bottom: 30px;
            font-size: 7px;
            color: var(--text-muted);
            opacity: 0.308;
            user-select: none;
            pointer-events: none;
            font-family: 'SF Mono', 'Consolas', monospace;
            letter-spacing: 0.552px;
            z-index: 1512;
            transition: opacity 0.232 ease;
        }
        body:hover .source-indicator { opacity: 0.528; }
        .timeout-notice {
            position: fixed; bottom: 20px; left: 50%;
            transform: translateX(-50%); font-size: 6.5px;
            color: var(--text-muted); opacity: 0; pointer-events: none;
            font-family: 'SF Mono', 'Consolas', monospace;
            letter-spacing: 0.258px; z-index: 1712;
            transition: opacity 0.482 ease;
            background: rgba(10,10,10,0.635); padding: 1px 2px;
            border-radius: 1px; border: 1px solid rgba(51,51,51,0.098);
        }
        .timeout-notice.show { opacity: 0.402; }
    </style>
</head>
<body>
    <div class="bg-image" id="bgImage"></div>
    <div class="overlay"></div>
    <div class="cursor-glow" id="glow"></div>
    <div class="timeout-notice" id="timeoutNotice">远程图片加载失败</div>
    <div class="breadcrumb">
        <span id="bHome" onclick="goHome()">首页</span> / <span id="bBack" onclick="goBack()">返回</span>
    </div>
    <div class="btn-help">?
        <div class="help-tooltip" id="helpTooltip">
            <strong>迷路了吗？</strong><br>
            按 Esc 返回<br>
            点击 ← 回到上页<br>
            点击 ↻ 重载页面<br>
            点击 EN/中 切换语言
        </div>
    </div>
    <div class="container">
        <div class="error-code" id="errorCode">404</div>
        <div class="quote-wrapper" id="quoteWrapper">
            <div class="quote" id="hitokoto">正在检索数据...</div>
            <div class="from" id="from"></div>
        </div>
        <div class="action-bar">
            <button class="btn-base btn-back" id="btnBack" onclick="goBack()" title="返回 (Esc)">←</button>
            <button class="btn-base btn-add" id="btnPageRefresh" onclick="location.reload()">↻ 刷新</button>
        </div>
    </div>
    <div class="bottom-buttons">
        <div class="left-buttons">
            <button class="mini-btn" id="btnSource" onclick="openSource()">源图</button>
            <button class="mini-btn" id="btnContentRefresh" onclick="reloadAll()">刷新</button>
        </div>
        <div class="right-buttons">
            <button class="mini-btn" id="btnLang" onclick="toggleLang()">EN</button>
        </div>
    </div>
    <span class="source-indicator" id="sourceIndicator">src: ---</span>
    <footer id="footer"></footer>

<script>
/* ===== i18n ===== */
const i18n = {
    zh: {
        footer: '© 2026 Your Site · 按 Esc 返回',
        fallback: '似乎迷失在了未知的空间里。',
        api: 'https://v1.hitokoto.cn/?c=i&c=j',
        help: `<strong>迷路了吗？</strong><br>• 按 <strong>Esc</strong> 返回<br>• 点击 <strong>←</strong> 回到上页<br>• 点击 <strong>↻</strong> 重载页面<br>• 点击 <strong>EN/中</strong> 切换语言`,
        bHome: '首页', bBack: '返回',
        btnSource: '源图', btnPageRefresh: '↻ 刷新',
        btnContentRefresh: '刷新',
        btnBackTitle: '返回 (Esc)',
        btnLang: 'EN'
    },
    en: {
        footer: '© 2026 Your Site · Press Esc to go back',
        fallback: 'It seems you\'re lost in the void.',
        api: 'https://api.quotable.io/random',
        help: `<strong>Lost?</strong><br>• Press <strong>Esc</strong> to go back<br>• Click <strong>←</strong> to previous page<br>• Click <strong>↻</strong> to reload page<br>• Click <strong>EN/中</strong> to switch language`,
        bHome: 'Home', bBack: 'Back',
        btnSource: 'Source', btnPageRefresh: '↻ Refresh',
        btnContentRefresh: 'Refresh',
        btnBackTitle: 'Back (Esc)',
        btnLang: '中'
    }
};
const enLocalQuotes = [
    { q: "Not all those who wander are lost.", a: "J.R.R. Tolkien" },
    { q: "The journey of a thousand miles begins with one step.", a: "Lao Tzu" },
    { q: "In the middle of difficulty lies opportunity.", a: "Albert Einstein" },
    { q: "What you seek is seeking you.", a: "Rumi" },
    { q: "Even the darkest night will end and the sun will rise.", a: "Victor Hugo" },
    { q: "Every page has an end. Yet we go on reading.", a: "" },
    { q: "Maybe it's not about the destination, but the detour.", a: "" },
];
function detectLang() {
    const saved = localStorage.getItem('lang');
    if (saved && i18n[saved]) return saved;
    const nav = (navigator.language || '').toLowerCase();
    if (nav.startsWith('zh')) return 'zh';
    return 'en';
}
let currentLang = detectLang();
let currentBgUrl = '';
function applyLang(l) {
    currentLang = l;
    localStorage.setItem('lang', l);
    const t = i18n[l];
    document.getElementById('btnLang').innerText = t.btnLang;
    document.getElementById('btnSource').innerText = t.btnSource;
    document.getElementById('btnPageRefresh').innerText = t.btnPageRefresh;
    document.getElementById('btnContentRefresh').innerText = t.btnContentRefresh;
    document.getElementById('btnBack').title = t.btnBackTitle;
    document.getElementById('bHome').innerText = t.bHome;
    document.getElementById('bBack').innerText = t.bBack;
    document.getElementById('footer').innerText = t.footer;
    document.getElementById('helpTooltip').innerHTML = t.help;
    loadHitokoto();
}
let timeoutNoticeTimer = null;
function showTimeoutNotice() {
    const notice = document.getElementById('timeoutNotice');
    notice.classList.add('show');
    if (timeoutNoticeTimer) clearTimeout(timeoutNoticeTimer);
    timeoutNoticeTimer = setTimeout(() => notice.classList.remove('show'), 2460);
}

/* ===== 本地图片配置 ===== */
const LOCAL_MAX = 50;               // 只扫描前50张
const LOCAL_DIR = './assets/bg/';
const LOCAL_PREFIX = 'bg-';
const LOCAL_EXTS = ['jpg', 'jpeg', 'png', 'webp']; // 优先尝试的顺序

/**
 * 随机选一个本地索引，并尝试加载（最多尝试3次不同索引）
 * @returns {Promise<string|null>} 成功返回图片URL，失败返回null
 */
function loadRandomLocalImage(retries = 3) {
    return new Promise(resolve => {
        const tried = new Set();
        attempt();

        function attempt() {
            if (tried.size >= retries) {
                resolve(null);
                return;
            }
            let idx;
            do {
                idx = Math.floor(Math.random() * LOCAL_MAX) + 1; // 1~50
            } while (tried.has(idx));
            tried.add(idx);

            // 尝试不同扩展名
            tryExt(0);

            function tryExt(extIdx) {
                if (extIdx >= LOCAL_EXTS.length) {
                    // 所有扩展名都失败，尝试下一个索引
                    attempt();
                    return;
                }
                const ext = LOCAL_EXTS[extIdx];
                const url = `${LOCAL_DIR}${LOCAL_PREFIX}${idx}.${ext}`;
                const img = new Image();
                img.onload = () => resolve(url);
                img.onerror = () => tryExt(extIdx + 1);
                img.src = url;
            }
        }
    });
}

/* ===== 远程源 ===== */
const REMOTE_SOURCE = {
    name: 'loliapi',
    label: 'loliapi.acg',
    url: () => `https://www.loliapi.com/acg/?type=json&t=${Date.now()}`,
    parse: (d) => d.imgurl || d.url || null
};

function updateSourceIndicator(label) {
    document.getElementById('sourceIndicator').textContent = `src: ${label}`;
}

/* ===== JS 通用淡出淡入 ===== */
function fadeOut(el, duration = 690) {
    return new Promise(resolve => {
        const startTime = performance.now();
        const startOpacity = parseFloat(getComputedStyle(el).opacity) || 1;
        function step(now) {
            const elapsed = now - startTime;
            const progress = Math.min(elapsed / duration, 1);
            const eased = progress * progress;
            const opacity = startOpacity * (1 - eased);
            const translateY = 10 * eased;
            el.style.opacity = opacity;
            el.style.transform = `translateY(${translateY}px)`;
            if (progress < 1) requestAnimationFrame(step);
            else { el.style.opacity = '0'; el.style.transform = 'translateY(10px)'; resolve(); }
        }
        requestAnimationFrame(step);
    });
}

function fadeIn(el, duration = 770) {
    return new Promise(resolve => {
        const startTime = performance.now();
        el.style.opacity = '0';
        el.style.transform = 'translateY(10px)';
        function step(now) {
            const elapsed = now - startTime;
            const progress = Math.min(elapsed / duration, 1);
            const eased = 1 - (1 - progress) * (1 - progress);
            const opacity = eased;
            const translateY = 10 * (1 - eased);
            el.style.opacity = opacity;
            el.style.transform = `translateY(${translateY}px)`;
            if (progress < 1) requestAnimationFrame(step);
            else { el.style.opacity = '1'; el.style.transform = 'translateY(0)'; resolve(); }
        }
        requestAnimationFrame(step);
    });
}

/* ===== 背景图切换 ===== */
async function setBackgroundImage(url, label) {
    const bg = document.getElementById('bgImage');
    const currentOpacity = parseFloat(getComputedStyle(bg).opacity);
    if (currentOpacity > 0.015) await fadeOut(bg, 715);
    bg.style.backgroundImage = `url(${url})`;
    currentBgUrl = url;
    updateSourceIndicator(label);
    await fadeIn(bg, 785);
}

/* ===== 核心加载逻辑 ===== */
async function loadBackground() {
    const useRemote = Math.random() < 0.5; // 50%概率选远程

    if (useRemote) {
        // 尝试远程
        try {
            const res = await fetch(REMOTE_SOURCE.url());
            const d = await res.json();
            const imgUrl = REMOTE_SOURCE.parse(d);
            if (imgUrl) {
                await setBackgroundImage(imgUrl, REMOTE_SOURCE.label);
                return;
            }
        } catch {}
        // 远程失败，回退到本地
        showTimeoutNotice();
        const localUrl = await loadRandomLocalImage(3);
        if (localUrl) {
            await setBackgroundImage(localUrl, 'local:fallback');
        } else {
            await setBackgroundImage('data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1 1"%3E%3Crect fill="%231a1a1a" width="1" height="1"/%3E%3C/svg%3E', 'no image');
        }
    } else {
        // 直接使用本地
        const localUrl = await loadRandomLocalImage(3);
        if (localUrl) {
            await setBackgroundImage(localUrl, 'local:random');
        } else {
            await setBackgroundImage('data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1 1"%3E%3Crect fill="%231a1a1a" width="1" height="1"/%3E%3C/svg%3E', 'no image');
        }
    }
}

/* ===== 一言 ===== */
async function loadHitokoto() {
    const w = document.getElementById('quoteWrapper'),
          q = document.getElementById('hitokoto'),
          f = document.getElementById('from');
    const currentOpacity = parseFloat(getComputedStyle(w).opacity);
    if (currentOpacity > 0.025) await fadeOut(w, 590);
    try {
        if (currentLang === 'zh') {
            const res = await fetch(i18n.zh.api);
            const d = await res.json();
            q.innerText = d.hitokoto;
            f.innerText = d.from ? `—— ${d.from}` : '';
        } else {
            const res = await fetchWithTimeout(i18n.en.api, 3280);
            const d = await res.json();
            q.innerText = d.content || i18n.en.fallback;
            f.innerText = d.author ? `— ${d.author}` : '';
        }
    } catch {
        if (currentLang === 'en') {
            const pick = enLocalQuotes[Math.floor(Math.random() * enLocalQuotes.length)];
            q.innerText = pick.q;
            f.innerText = pick.a ? `— ${pick.a}` : '';
        } else {
            q.innerText = i18n.zh.fallback;
            f.innerText = '';
        }
    }
    await fadeIn(w, 695);
}

function fetchWithTimeout(url, ms = 2760) {
    return Promise.race([fetch(url), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
}

function reloadAll() { loadBackground(); loadHitokoto(); }
function openSource() { if(currentBgUrl && !currentBgUrl.startsWith(LOCAL_DIR) && !currentBgUrl.startsWith('data:')) window.open(currentBgUrl, '_blank', 'noopener'); }
function goHome() { location.href='/'; }
function goBack() { document.referrer ? history.back() : location.href='/'; }
function toggleLang() { applyLang(currentLang==='zh'?'en':'zh'); }
document.addEventListener('keydown', e => { if(e.key==='Escape') goBack(); });
document.addEventListener('mousemove', e => {
    document.getElementById('glow').style.left = e.clientX+'px';
    document.getElementById('glow').style.top = e.clientY+'px';
});

/* ===== 404 浮动动画 ===== */
(function() {
    const errorEl = document.getElementById('errorCode');
    let startTime = performance.now();
    function floatLoop(time) {
        const elapsed = time - startTime;
        const y = Math.sin(elapsed / 636) * 7;
        errorEl.style.transform = `translateY(${y}px)`;
        requestAnimationFrame(floatLoop);
    }
    requestAnimationFrame(floatLoop);
})();

applyLang(currentLang);
loadBackground();
setInterval(loadHitokoto, 7080);
</script>
</body>
</html>
