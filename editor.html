<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卡片编辑器</title>
    <style>
        :root {
            --bg: #1a1a1a;
            --panel: #2b2b2b;
            --border: #444;
            --text: #e0e0e0;
            --accent: #3b8526;
            --danger: #c0392b;
            --nav-bg: #222;
            --font-size-base: 13px;
            --font-size-sm: 11px;
            --font-size-xs: 10px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body {
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            line-height: 1.4;
            font-size: var(--font-size-base);
        }

        /* 导航栏 */
        .navbar {
            background: var(--nav-bg);
            border-bottom: 1px solid var(--border);
            padding: 0 16px;
            display: flex;
            align-items: center;
            height: 46px;
            gap: 10px;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            z-index: 110;
        }
        .nav-brand { font-size: 14px; font-weight: bold; color: #fff; display: flex; align-items: center; gap: 6px; }
        .nav-spacer { flex: 1; }

        .nav-buttons {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .nav-buttons button, .nav-buttons a {
            background: none;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: var(--font-size-sm);
            transition: all .2s;
            text-decoration: none;
        }
        .nav-buttons button:hover, .nav-buttons a:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(59,133,38,.1);
        }

        .nav-menu-toggle {
            display: none;
            background: none;
            border: 1px solid var(--border);
            color: var(--text);
            width: 32px;
            height: 32px;
            border-radius: 4px;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all .2s;
        }
        .nav-menu-toggle:hover {
            background: rgba(255,255,255,.08);
            border-color: var(--accent);
        }

        .nav-dropdown {
            position: absolute;
            top: 47px;
            right: 16px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 6px;
            min-width: 220px;
            box-shadow: 0 8px 24px rgba(0,0,0,.5);
            overflow: hidden;
            max-height: 0;
            opacity: 0;
            transition: max-height .2s ease, opacity .15s ease;
            pointer-events: none;
            z-index: 111;
        }
        .nav-dropdown.open {
            max-height: 430px;
            opacity: 1;
            pointer-events: auto;
        }
        .nav-dropdown a, .nav-dropdown button {
            display: block;
            width: 100%;
            padding: 9px 14px;
            background: none;
            border: none;
            color: var(--text);
            text-align: left;
            font-size: var(--font-size-sm);
            cursor: pointer;
            transition: background .15s;
            text-decoration: none;
        }
        .nav-dropdown a:hover, .nav-dropdown button:hover {
            background: rgba(255,255,255,.06);
        }
        .nav-dropdown a:not(:last-child), .nav-dropdown button:not(:last-child) {
            border-bottom: 1px solid rgba(255,255,255,.06);
        }

        @media (max-width: 980px) {
            .nav-buttons { display: none; }
            .nav-menu-toggle { display: flex; }
        }
        @media (min-width: 981px) {
            .nav-menu-toggle { display: none !important; }
            .nav-dropdown { display: none !important; }
        }

        /* 主布局 */
        .editor-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 286px;
            min-width: 226px;
            background: var(--panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .sidebar-header {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sidebar-header h3 { font-size: var(--font-size-sm); color: #ccc; }
        .sidebar-list {
            flex: 1;
            overflow-y: auto;
            padding: 6px;
        }
        .cat-item {
            background: rgba(255,255,255,.03);
            border: 1px solid var(--border);
            border-radius: 5px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: all .2s;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .cat-item:hover { border-color: #666; }
        .cat-item.active { border-color: var(--accent); background: rgba(59,133,38,.1); }
        .cat-item .cat-icon { font-size: 18px; width: 26px; text-align: center; }
        .cat-item .cat-icon img { width: 20px; height: 20px; object-fit: contain; vertical-align: middle; }
        .cat-item .cat-name { flex: 1; font-size: var(--font-size-sm); color: #ddd; }
        .cat-item .cat-count { font-size: var(--font-size-xs); color: #888; background: rgba(255,255,255,.08); padding: 1px 6px; border-radius: 8px; }
        .cat-item .cat-del {
            font-size: 12px; color: #666; cursor: pointer; padding: 2px 4px; border-radius: 3px; transition: all .2s;
        }
        .cat-item .cat-del:hover { color: var(--danger); background: rgba(192,57,43,.1); }

        .empty-msg { text-align: center; color: #666; font-size: var(--font-size-sm); padding: 40px 10px; }

        .main-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 14px;
        }
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .panel-header h2 { font-size: 16px; color: #eee; }
        .panel-header .actions { display: flex; gap: 6px; }
        .panel-header .actions button {
            background: none; border: 1px solid var(--border); color: var(--text);
            padding: 3px 8px; border-radius: 4px; cursor: pointer; font-size: var(--font-size-xs); transition: all .2s;
        }
        .panel-header .actions button:hover { border-color: var(--accent); color: var(--accent); }

        .cat-form {
            background: rgba(255,255,255,.024);
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 12px;
            margin-bottom: 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .cat-form label { font-size: var(--font-size-xs); color: #aaa; }
        .cat-form input, .cat-form select {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 4px 6px;
            border-radius: 4px;
            font-size: var(--font-size-sm);
            outline: none;
        }
        .cat-form input:focus { border-color: var(--accent); }
        .cat-form .field-group { display: flex; align-items: center; gap: 5px; }
        .cat-form .field-group input { width: 118px; }

        .link-list {
            flex: 1;
            overflow-y: auto;
        }

        .link-card-editor {
            background: rgba(255,255,255,.021);
            border: 1px solid var(--border);
            border-radius: 5px;
            margin-bottom: 6px;
            overflow: hidden;
            transition: border-color .2s;
        }
        .link-card-editor.open { border-color: var(--accent); }

        .link-card-header {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 10px;
            cursor: pointer;
            user-select: none;
            background: rgba(255,255,255,.014);
            transition: background .15s;
        }
        .link-card-header:hover { background: rgba(255,255,255,.034); }

        .link-card-header .arrow {
            font-size: 9px;
            color: #666;
            transition: transform .25s;
            width: 10px;
            text-align: center;
        }
        .link-card-editor.open .link-card-header .arrow {
            transform: rotate(90deg);
            color: var(--accent);
        }

        .link-card-header .lc-icon { font-size: 16px; width: 22px; text-align: center; }
        .link-card-header .lc-icon img { width: 18px; height: 18px; object-fit: contain; vertical-align: middle; }
        .link-card-header .lc-title {
            flex: 1;
            font-size: var(--font-size-sm);
            color: #ddd;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .link-card-header .lc-url {
            font-size: var(--font-size-xs);
            color: #666;
            max-width: 146px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .link-card-header .lc-del {
            font-size: 12px;
            color: #666;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 3px;
            transition: all .2s;
            z-index: 2;
        }
        .link-card-header .lc-del:hover { color: var(--danger); background: rgba(192,57,43,.1); }

        .link-card-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height .38s cubic-bezier(0.178, 0.886, 0.368, 1), padding .26s ease;
            padding: 0 10px;
        }
        .link-card-editor.open .link-card-body {
            max-height: 540px;
            padding: 6px 10px 10px;
        }

        .link-card-body .link-fields {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }
        .link-card-body .link-fields input {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 3px 6px;
            border-radius: 4px;
            font-size: var(--font-size-xs);
            outline: none;
            min-width: 66px;
        }
        .link-card-body .link-fields input:focus { border-color: var(--accent); }
        .link-card-body .link-fields .field-label { font-size: var(--font-size-xs); color: #888; margin-right: 1px; }
        .link-card-body .link-actions {
            display: flex;
            gap: 3px;
            margin-top: 4px;
        }
        .link-card-body .link-actions button {
            background: none; border: 1px solid var(--border); color: #999;
            padding: 1px 6px; border-radius: 3px; cursor: pointer; font-size: var(--font-size-xs); transition: all .2s;
        }
        .link-card-body .link-actions button:hover { border-color: var(--accent); color: var(--accent); }
        .link-card-body .link-actions .del-btn:hover { border-color: var(--danger); color: var(--danger); }

        .add-link-btn {
            width: 100%;
            padding: 6px;
            background: none;
            border: 2px dashed var(--border);
            color: #888;
            border-radius: 5px;
            cursor: pointer;
            font-size: var(--font-size-sm);
            transition: all .2s;
            margin-top: 3px;
        }
        .add-link-btn:hover { border-color: var(--accent); color: var(--accent); }

        .preview-section {
            margin-top: 14px;
            border-top: 1px solid var(--border);
            padding-top: 10px;
        }
        .preview-section summary {
            cursor: pointer;
            font-size: var(--font-size-sm);
            color: #aaa;
            user-select: none;
        }
        .preview-content {
            margin-top: 6px;
            background: rgba(255,255,255,.019);
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 10px;
            max-height: 265px;
            overflow-y: auto;
        }
        .preview-content .mini-card {
            background: rgba(255,255,255,.041);
            border: 1px solid rgba(255,255,255,.068);
            border-radius: 4px;
            padding: 6px 8px;
            margin-bottom: 5px;
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .preview-content .mini-card .pc-icon { font-size: 18px; width: 26px; text-align: center; }
        .preview-content .mini-card .pc-icon img { width: 20px; height: 20px; object-fit: contain; vertical-align: middle; }
        .preview-content .mini-card .pc-title { font-size: var(--font-size-sm); color: #ddd; flex: 1; }
        .preview-content .mini-card .pc-desc { font-size: var(--font-size-xs); color: #888; }

        @media (max-width: 930px) {
            .editor-layout { flex-direction: column; }
            .sidebar { width: 100%; min-width: unset; max-height: 206px; border-right: none; border-bottom: 1px solid var(--border); }
            .main-panel { padding: 10px; }
            .cat-form { flex-direction: column; align-items: stretch; }
            .cat-form .field-group { width: 100%; }
            .cat-form .field-group input { width: 100%; }
            .link-card-body .link-fields { flex-direction: column; align-items: stretch; }
            .link-card-header .lc-url { display: none; }
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }

        .toast {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--panel);
            border: 1px solid var(--accent);
            color: var(--text);
            padding: 8px 18px;
            border-radius: 5px;
            font-size: var(--font-size-sm);
            z-index: 994;
            opacity: 0;
            transition: opacity .3s;
            pointer-events: none;
        }
        .toast.show { opacity: 1; }

        /* 自定义确认模态框 */
        .confirm-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.49);
            z-index: 898;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity .24s, visibility .24s;
        }
        .confirm-overlay.show {
            opacity: 1;
            visibility: visible;
        }
        .confirm-modal {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 18px 22px;
            max-width: 336px;
            width: 88%;
            transform: scale(.87) translateY(14px);
            transition: transform .3s cubic-bezier(0.164, 0.848, 0.338, 1.086);
        }
        .confirm-overlay.show .confirm-modal {
            transform: scale(1) translateY(0);
        }
        .confirm-modal .msg {
            font-size: var(--font-size-sm);
            color: #ddd;
            margin-bottom: 16px;
            line-height: 1.5;
        }
        .confirm-modal .btns {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
        .confirm-modal .btns button {
            padding: 5px 14px;
            border-radius: 4px;
            border: 1px solid var(--border);
            font-size: var(--font-size-sm);
            cursor: pointer;
            transition: all .2s;
            background: none;
            color: var(--text);
        }
        .confirm-modal .btns button:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        .confirm-modal .btns .confirm-danger {
            background: var(--danger);
            color: #fff;
            border-color: var(--danger);
        }
        .confirm-modal .btns .confirm-danger:hover {
            opacity: .82;
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="nav-brand">🛠️ 卡片编辑器</div>
    <div class="nav-spacer"></div>
    <div class="nav-buttons">
        <button onclick="loadFromServer()">📂 加载</button>
        <button onclick="exportDownload()">⬇️ 下载 JSON</button>
        <button onclick="exportCopy()">📋 复制 JSON</button>
        <a href="index.html">← 返回主页</a>
    </div>
    <button class="nav-menu-toggle" id="navToggle">☰</button>
    <div class="nav-dropdown" id="navDropdown">
        <button onclick="loadFromServer()">📂 加载</button>
        <button onclick="exportDownload()">⬇️ 下载 JSON</button>
        <button onclick="exportCopy()">📋 复制 JSON</button>
        <a href="index.html">← 返回主页</a>
    </div>
</nav>

<div class="editor-layout">
    <div class="sidebar">
        <div class="sidebar-header">
            <h3>📁 分类列表</h3>
            <button onclick="addCategory()" style="background:var(--accent);color:#fff;border:none;padding:2px 8px;border-radius:4px;cursor:pointer;font-size:var(--font-size-xs);">+ 新增</button>
        </div>
        <div class="sidebar-list" id="categoryList"></div>
    </div>

    <div class="main-panel" id="mainPanel">
        <div class="panel-header">
            <h2 id="editTitle">选择一个分类进行编辑</h2>
            <div class="actions">
                <button onclick="moveCategory(-1)">⬆ 上移</button>
                <button onclick="moveCategory(1)">⬇ 下移</button>
                <button onclick="deleteCategory()" style="color:var(--danger);">🗑 删除分类</button>
            </div>
        </div>

        <div class="cat-form" id="catForm">
            <div class="field-group">
                <label>分类图标</label>
                <input type="text" id="catIcon" placeholder="emoji 或图片URL" style="width:72px;">
            </div>
            <div class="field-group">
                <label>名称(zh)</label>
                <input type="text" id="catNameZh" placeholder="中文名称">
            </div>
            <div class="field-group">
                <label>名称(en)</label>
                <input type="text" id="catNameEn" placeholder="English name">
            </div>
        </div>

        <div class="link-list" id="linkList">
            <div class="empty-msg">请先在左侧选择一个分类</div>
        </div>

        <details class="preview-section">
            <summary>👁️ 预览当前分类</summary>
            <div class="preview-content" id="previewContent"></div>
        </details>
    </div>
</div>

<!-- 自定义确认模态框 -->
<div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-modal">
        <div class="msg" id="confirmMsg">确定要删除吗？</div>
        <div class="btns">
            <button id="confirmCancel">取消</button>
            <button class="confirm-danger" id="confirmOk">删除</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    // ============================================================
    // 数据模型
    // ============================================================
    let categories = [];
    let selectedIdx = -1;
    let dirty = false;

    const DATA_BASE = './data/';
    const MANIFEST_URL = DATA_BASE + 'manifest.json';
    const CARDS_DIR = DATA_BASE + 'cards/';

    // ============================================================
    // 工具函数：判断是否为图片URL
    // ============================================================
    function isImageUrl(str) {
        if (!str) return false;
        return /^(https?:\/\/)|\.(png|jpg|jpeg|gif|svg|webp)(\?.*)?$/i.test(str);
    }

    // 渲染图标（支持图片和emoji，带占位符）
    function renderIcon(icon, size = 20) {
        if (isImageUrl(icon)) {
            return `<span style="display:inline-flex;align-items:center;justify-content:center;background:#333;border-radius:2px;width:${size}px;height:${size}px;">
                <img src="${icon}" alt="" loading="lazy" style="width:100%;height:100%;object-fit:contain;"
                     onload="this.parentElement.style.background='transparent'"
                     onerror="this.style.display='none';this.parentElement.innerHTML='<span style=\\'color:#888;font-size:${size-4}px\\'>🔗</span>'">
            </span>`;
        }
        return icon || '🔗';
    }

    // ============================================================
    // Toast
    // ============================================================
    function showToast(msg, duration = 3000) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(t._timer);
        t._timer = setTimeout(() => t.classList.remove('show'), duration);
    }

    // ============================================================
    // 自定义确认弹窗
    // ============================================================
    let confirmCallback = null;

    function showConfirm(message, callback) {
        const overlay = document.getElementById('confirmOverlay');
        const msgEl = document.getElementById('confirmMsg');
        msgEl.textContent = message;
        confirmCallback = callback;
        overlay.classList.add('show');
    }

    function hideConfirm() {
        document.getElementById('confirmOverlay').classList.remove('show');
        confirmCallback = null;
    }

    document.getElementById('confirmOk').addEventListener('click', function() {
        if (typeof confirmCallback === 'function') {
            confirmCallback(true);
        }
        hideConfirm();
    });

    document.getElementById('confirmCancel').addEventListener('click', function() {
        if (typeof confirmCallback === 'function') {
            confirmCallback(false);
        }
        hideConfirm();
    });

    document.getElementById('confirmOverlay').addEventListener('click', function(e) {
        if (e.target === this) {
            if (typeof confirmCallback === 'function') {
                confirmCallback(false);
            }
            hideConfirm();
        }
    });

    // ============================================================
    // 加载数据
    // ============================================================
    async function loadFromServer() {
        try {
            const manResp = await fetch(MANIFEST_URL);
            if (!manResp.ok) throw new Error('manifest.json 未找到');
            const fileNames = await manResp.json();
            const promises = fileNames.map(async (name) => {
                const resp = await fetch(CARDS_DIR + name + '.json');
                if (!resp.ok) throw new Error(name + '.json 加载失败');
                const data = await resp.json();
                return { fileName: name, data };
            });
            const results = await Promise.all(promises);
            categories = results.map(r => ({ ...r.data, _fileName: r.fileName }));
            selectedIdx = categories.length > 0 ? 0 : -1;
            dirty = false;
            renderSidebar();
            renderEditor();
            showToast('✅ 已加载 ' + categories.length + ' 个分类');
        } catch (err) {
            showToast('❌ 加载失败: ' + err.message);
            categories = [
                {
                    _fileName: 'sample',
                    name: { zh: '示例分类', en: 'Sample' },
                    icon: '📁',
                    items: [
                        { title: { zh: '示例链接', en: 'Example Link' }, desc: { zh: '描述', en: 'Description' }, url: 'https://example.com', icon: '🔗' }
                    ]
                }
            ];
            selectedIdx = 0;
            renderSidebar();
            renderEditor();
        }
    }

    // ============================================================
    // 导出功能
    // ============================================================
    function buildExportPackage() {
        const manifest = categories.map(c => c._fileName || 'unnamed');
        const files = categories.map(c => {
            const { _fileName, ...rest } = c;
            return { fileName: _fileName || 'unnamed', content: rest };
        });
        return { manifest, files };
    }

    function exportDownload() {
        const pkg = buildExportPackage();
        const blob = new Blob([JSON.stringify(pkg, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'cards-backup.json';
        a.click();
        URL.revokeObjectURL(url);
        showToast('✅ 已下载 cards-backup.json\n将文件内容解压后覆盖 data/ 目录下的对应文件');
    }

    function exportCopy() {
        const pkg = buildExportPackage();
        const text = JSON.stringify(pkg, null, 2);
        navigator.clipboard.writeText(text).then(() => {
            showToast('✅ 已复制到剪贴板\n使用提示：\n1. 创建 data/manifest.json，内容为文件名数组\n2. 在 data/cards/ 下创建每个文件\n3. 将 JSON 内容粘贴到对应文件中');
        }).catch(() => {
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showToast('✅ 已复制到剪贴板\n使用提示：\n1. 创建 data/manifest.json，内容为文件名数组\n2. 在 data/cards/ 下创建每个文件\n3. 将 JSON 内容粘贴到对应文件中');
        });
    }

    // ============================================================
    // 渲染
    // ============================================================
    function renderSidebar() {
        const list = document.getElementById('categoryList');
        if (categories.length === 0) {
            list.innerHTML = '<div class="empty-msg">暂无分类，点击上方新增</div>';
            return;
        }
        list.innerHTML = categories.map((cat, idx) => {
            const name = typeof cat.name === 'object' ? (cat.name.zh || cat.name.en || '未命名') : (cat.name || '未命名');
            const iconHtml = renderIcon(cat.icon, 20);
            const count = cat.items ? cat.items.length : 0;
            const active = idx === selectedIdx ? ' active' : '';
            return `
                <div class="cat-item${active}" onclick="selectCategory(${idx})">
                    <span class="cat-icon">${iconHtml}</span>
                    <span class="cat-name">${escapeHtml(name)}</span>
                    <span class="cat-count">${count}</span>
                    <span class="cat-del" onclick="event.stopPropagation(); deleteCategoryConfirm(${idx})">✕</span>
                </div>
            `;
        }).join('');
    }

    function renderEditor() {
        if (selectedIdx < 0 || selectedIdx >= categories.length) {
            document.getElementById('editTitle').textContent = '选择一个分类进行编辑';
            document.getElementById('catForm').style.display = 'none';
            document.getElementById('linkList').innerHTML = '<div class="empty-msg">请先在左侧选择一个分类</div>';
            document.getElementById('previewContent').innerHTML = '';
            return;
        }
        const cat = categories[selectedIdx];
        document.getElementById('editTitle').textContent = '编辑: ' + (typeof cat.name === 'object' ? (cat.name.zh || cat.name.en) : cat.name);
        document.getElementById('catForm').style.display = 'flex';
        document.getElementById('catIcon').value = cat.icon || '';
        document.getElementById('catNameZh').value = (cat.name && cat.name.zh) || '';
        document.getElementById('catNameEn').value = (cat.name && cat.name.en) || '';
        renderLinkList();
        renderPreview();
    }

    function renderLinkList() {
        const container = document.getElementById('linkList');
        const cat = categories[selectedIdx];
        if (!cat || !cat.items) {
            container.innerHTML = '<div class="empty-msg">该分类暂无链接</div>';
            return;
        }

        let html = '';
        cat.items.forEach((item, idx) => {
            const title = typeof item.title === 'object' ? (item.title.zh || item.title.en || '') : (item.title || '');
            const desc = typeof item.desc === 'object' ? (item.desc.zh || item.desc.en || '') : (item.desc || '');
            const url = item.url || '';
            const iconHtml = renderIcon(item.icon, 18);

            html += `
                <div class="link-card-editor" data-index="${idx}">
                    <div class="link-card-header" onclick="toggleLinkCard(this)">
                        <span class="arrow">▶</span>
                        <span class="lc-icon">${iconHtml}</span>
                        <span class="lc-title">${escapeHtml(title)}</span>
                        <span class="lc-url">${escapeHtml(url)}</span>
                        <span class="lc-del" onclick="event.stopPropagation(); deleteLink(${idx})">✕</span>
                    </div>
                    <div class="link-card-body">
                        <div class="link-fields">
                            <span class="field-label">图标</span>
                            <input type="text" value="${escapeAttr(item.icon || '')}" placeholder="emoji/URL" style="width:58px;" onchange="updateLinkField(${idx},'icon',this.value)">
                            <span class="field-label">标题(zh)</span>
                            <input type="text" value="${escapeAttr(typeof item.title === 'object' ? (item.title.zh||'') : item.title)}" placeholder="中文" onchange="updateLinkField(${idx},'titleZh',this.value)">
                            <span class="field-label">标题(en)</span>
                            <input type="text" value="${escapeAttr(typeof item.title === 'object' ? (item.title.en||'') : '')}" placeholder="English" onchange="updateLinkField(${idx},'titleEn',this.value)">
                            <span class="field-label">描述(zh)</span>
                            <input type="text" value="${escapeAttr(typeof item.desc === 'object' ? (item.desc.zh||'') : item.desc)}" placeholder="中文描述" onchange="updateLinkField(${idx},'descZh',this.value)">
                            <span class="field-label">描述(en)</span>
                            <input type="text" value="${escapeAttr(typeof item.desc === 'object' ? (item.desc.en||'') : '')}" placeholder="English desc" onchange="updateLinkField(${idx},'descEn',this.value)">
                            <span class="field-label">URL</span>
                            <input type="text" value="${escapeAttr(url)}" placeholder="https://..." style="flex:1;min-width:116px;" onchange="updateLinkField(${idx},'url',this.value)">
                        </div>
                        <div class="link-actions">
                            <button onclick="moveLink(${idx},-1)">⬆</button>
                            <button onclick="moveLink(${idx},1)">⬇</button>
                            <button class="del-btn" onclick="deleteLink(${idx})">🗑 删除</button>
                        </div>
                    </div>
                </div>
            `;
        });
        html += '<button class="add-link-btn" onclick="addLink()">+ 添加链接</button>';
        container.innerHTML = html;
    }

    function renderPreview() {
        const cat = categories[selectedIdx];
        const container = document.getElementById('previewContent');
        if (!cat || !cat.items || cat.items.length === 0) {
            container.innerHTML = '<div style="color:#666;font-size:var(--font-size-xs);">暂无链接</div>';
            return;
        }
        let html = '';
        cat.items.forEach(item => {
            const title = typeof item.title === 'object' ? (item.title.zh || item.title.en) : (item.title || '');
            const desc = typeof item.desc === 'object' ? (item.desc.zh || item.desc.en) : (item.desc || '');
            const iconHtml = renderIcon(item.icon, 20);
            html += `
                <div class="mini-card">
                    <span class="pc-icon">${iconHtml}</span>
                    <span class="pc-title">${escapeHtml(title)}</span>
                    <span class="pc-desc">${escapeHtml(desc)}</span>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    // ============================================================
    // 链接卡片折叠切换
    // ============================================================
    function toggleLinkCard(headerEl) {
        const card = headerEl.closest('.link-card-editor');
        card.classList.toggle('open');
    }

    // ============================================================
    // 分类操作
    // ============================================================
    function selectCategory(idx) {
        saveCatForm();
        selectedIdx = idx;
        renderSidebar();
        renderEditor();
    }

    function addCategory() {
        const newCat = {
            _fileName: 'new-cat-' + Date.now(),
            name: { zh: '新分类', en: 'New Category' },
            icon: '📁',
            items: []
        };
        categories.push(newCat);
        selectedIdx = categories.length - 1;
        dirty = true;
        renderSidebar();
        renderEditor();
        showToast('已添加新分类');
    }

    function deleteCategoryConfirm(idx) {
        showConfirm('确定删除此分类及其所有链接？', function(confirmed) {
            if (confirmed) {
                categories.splice(idx, 1);
                if (selectedIdx >= categories.length) selectedIdx = categories.length - 1;
                if (selectedIdx < 0 && categories.length > 0) selectedIdx = 0;
                dirty = true;
                renderSidebar();
                renderEditor();
                showToast('已删除分类');
            }
        });
    }

    function deleteCategory() {
        if (selectedIdx < 0) return;
        deleteCategoryConfirm(selectedIdx);
    }

    function moveCategory(dir) {
        if (selectedIdx < 0) return;
        const newIdx = selectedIdx + dir;
        if (newIdx < 0 || newIdx >= categories.length) return;
        [categories[selectedIdx], categories[newIdx]] = [categories[newIdx], categories[selectedIdx]];
        selectedIdx = newIdx;
        dirty = true;
        renderSidebar();
        renderEditor();
    }

    function saveCatForm() {
        if (selectedIdx < 0) return;
        const cat = categories[selectedIdx];
        cat.icon = document.getElementById('catIcon').value || '📁';
        const zh = document.getElementById('catNameZh').value.trim();
        const en = document.getElementById('catNameEn').value.trim();
        cat.name = {};
        if (zh) cat.name.zh = zh;
        if (en) cat.name.en = en;
        if (!zh && !en) cat.name = '未命名';
        dirty = true;
    }

    // ============================================================
    // 链接操作
    // ============================================================
    function updateLinkField(idx, field, value) {
        const cat = categories[selectedIdx];
        if (!cat.items[idx]) return;
        const item = cat.items[idx];
        switch (field) {
            case 'icon': item.icon = value; break;
            case 'titleZh':
                if (typeof item.title !== 'object') item.title = {};
                item.title.zh = value;
                break;
            case 'titleEn':
                if (typeof item.title !== 'object') item.title = {};
                item.title.en = value;
                break;
            case 'descZh':
                if (typeof item.desc !== 'object') item.desc = {};
                item.desc.zh = value;
                break;
            case 'descEn':
                if (typeof item.desc !== 'object') item.desc = {};
                item.desc.en = value;
                break;
            case 'url': item.url = value; break;
        }
        dirty = true;
        // 更新头部显示
        const card = document.querySelector(`.link-card-editor[data-index="${idx}"]`);
        if (card) {
            const titleEl = card.querySelector('.lc-title');
            const urlEl = card.querySelector('.lc-url');
            const iconEl = card.querySelector('.lc-icon');
            if (titleEl) titleEl.textContent = typeof item.title === 'object' ? (item.title.zh || item.title.en || '') : (item.title || '');
            if (urlEl) urlEl.textContent = item.url || '';
            if (iconEl) iconEl.innerHTML = renderIcon(item.icon, 18);
        }
        renderPreview();
    }

    function addLink() {
        const cat = categories[selectedIdx];
        if (!cat.items) cat.items = [];
        cat.items.push({
            title: { zh: '新链接', en: 'New Link' },
            desc: { zh: '描述', en: 'Description' },
            url: 'https://',
            icon: '🔗'
        });
        dirty = true;
        renderLinkList();
        renderPreview();
        showToast('已添加新链接');
    }

    function deleteLink(idx) {
        showConfirm('确定删除此链接？', function(confirmed) {
            if (confirmed) {
                const cat = categories[selectedIdx];
                cat.items.splice(idx, 1);
                dirty = true;
                renderLinkList();
                renderPreview();
                showToast('已删除链接');
            }
        });
    }

    function moveLink(idx, dir) {
        const cat = categories[selectedIdx];
        const newIdx = idx + dir;
        if (newIdx < 0 || newIdx >= cat.items.length) return;
        [cat.items[idx], cat.items[newIdx]] = [cat.items[newIdx], cat.items[idx]];
        dirty = true;
        renderLinkList();
        renderPreview();
    }

    // ============================================================
    // 工具函数
    // ============================================================
    function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }
    function escapeAttr(str) {
        if (!str) return '';
        return str.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // ============================================================
    // 移动端下拉菜单
    // ============================================================
    document.getElementById('navToggle').addEventListener('click', function() {
        document.getElementById('navDropdown').classList.toggle('open');
    });
    document.addEventListener('click', function(e) {
        const dd = document.getElementById('navDropdown');
        const tg = document.getElementById('navToggle');
        if (dd.classList.contains('open') && !dd.contains(e.target) && !tg.contains(e.target)) {
            dd.classList.remove('open');
        }
    });

    // ============================================================
    // 初始化
    // ============================================================
    document.addEventListener('DOMContentLoaded', () => {
        loadFromServer();
    });
</script>
</body>
</html>
