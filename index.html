<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="DBP-HUB - Minecraft 工具站，插件式懒加载架构（JS / HTML / Markdown）" />
  <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)" />
  <title>DBP-HUB · Minecraft 工具站</title>

  <link rel="icon" type="image/x-icon" href="./favicon.ico?v=0.9.33" />
  <link rel="shortcut icon" href="./favicon.ico?v=0.9.33" />

  <!-- 早期主题应用（CSS 加载前执行，防止闪烁） -->
  <script>
    (function () {
      var stored = localStorage.getItem('dbp-theme'); // 'light' | 'dark' | 'system'
      // ★ 默认跟随系统（此前默认 dark）
      var theme = stored || 'system';
      var resolved = theme;
      if (theme === 'system') {
        resolved = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', resolved);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', resolved === 'light' ? '#f5f5f5' : '#1a1a1a');
      window.__DBP_THEME = { current: theme, resolved: resolved };

      /* 早期应用自定义主题色（与 app.js 的 applyAccent 保持一致，防闪烁） */
      (function () {
        var DEFAULT = '#3b8526';
        var c = localStorage.getItem('dbp-accent') || DEFAULT;
        if (!/^#[0-9a-fA-F]{6}$/.test(c)) c = DEFAULT;
        var root = document.documentElement;
        var n = parseInt(c.slice(1), 16);
        var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
        var clamp = function (v) { return Math.max(0, Math.min(255, Math.round(v))); };
        var toHex = function (rr, gg, bb) {
          return '#' + [rr, gg, bb].map(function (v) { return ('0' + clamp(v).toString(16)).slice(-2); }).join('');
        };
        var rgba = function (a) { return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')'; };
        root.style.setProperty('--accent', c);
        root.style.setProperty('--accent-dark', toHex(r + 255 * -0.28, g + 255 * -0.28, b + 255 * -0.28));
        root.style.setProperty('--accent-dim', rgba(0.14));
        root.style.setProperty('--accent-glow', rgba(0.3));
        root.style.setProperty('--accent-soft', rgba(0.08));
        window.__DBP_ACCENT = c;
      })();
    })();
  </script>

  <!-- 早期错误捕获（在任何业务 JS 加载前生效） -->
  <script>
    window.__DBP_EARLY_ERRORS = [];
    /* ★ 404 页面内部资源（随机壁纸 / 一言）加载失败：静默忽略，不记录、不弹窗。
       严格限定在 404 页面上下文 + 静默标记 / 404 专用外站，其它资源不受影响。 */
    function __dbpQuiet404(target, url, reason) {
      try {
        var inCtx = /^#\/404\/?$/.test(String(location.hash || '')) ||
          !!(document.querySelector && document.querySelector('.dbp-404'));
        if (!inCtx) return false;
        if (target && target.getAttribute && target.getAttribute('data-dbp-quiet404') !== null) return true;
        if (reason && reason.__dbpQuiet404 === true) return true;
        var u = String(url || (target && (target.src || target.href)) || (reason && reason.message) || reason || '');
        return /loliapi\.com\/acg|v1\.hitokoto\.cn|api\.quotable\.io/i.test(u);
      } catch (x) { return false; }
    }
    window.__DBP_QUIET404 = __dbpQuiet404;
    /* ★ 304 Not Modified 是 HTTP 缓存协商的正常响应，不是错误。
       此处 utils.js 尚未加载，先内联一份等价判定；行号里的 304 不会误判。 */
    function __dbpNotModified(x) {
      if (x && typeof x === 'object') {
        if (x.status === 304 || x.statusCode === 304) return true;
        if (x.message !== undefined) return __dbpNotModified(x.message);
        return false;
      }
      return /HTTP\s*304|304\s*Not\s*Modified|\(304\)/i.test(String(x == null ? '' : x));
    }
    window.addEventListener('error', function (e) {
      if (__dbpQuiet404(e.target, null, null)) return;
      if (__dbpNotModified(e.message) || __dbpNotModified(e.error)) return;
      window.__DBP_EARLY_ERRORS.push({
        msg: e.message,
        src: (e.filename || '') + ':' + (e.lineno || '?') + ':' + (e.colno || '?'),
        time: new Date().toISOString(),
      });
    });
    window.addEventListener('unhandledrejection', function (e) {
      if (__dbpQuiet404(null, null, e.reason)) return;
      if (__dbpNotModified(e.reason)) return;
      window.__DBP_EARLY_ERRORS.push({
        msg: 'UnhandledRejection: ' + ((e.reason && e.reason.message) || String(e.reason)),
        src: 'promise',
        time: new Date().toISOString(),
      });
    });
    console.log('[DBP] 早期错误捕获已就绪 (v0.9.20)');
  </script>

  <link rel="stylesheet" href="./vendor/font-awesome.min.css?v=0.9.33" />
  <script src="./vendor/vue.global.prod.js?v=0.9.33"></script>
  <script src="./vendor/vue-router.global.prod.js?v=0.9.33"></script>
  <!-- 本地开源字体 Noto Serif SC（SIL OFL 1.1），内置 404 中央区使用 -->
  <link rel="stylesheet" href="./assets/fonts/noto-serif-sc.css?v=0.9.33" />
  <link rel="stylesheet" href="./styles/main.css?v=0.9.33" />
</head>
<body>
  <!-- 无初始化弹窗：应用挂载后由常驻错误面板承载所有错误信息 -->
  <div id="app-root"></div>

  <!-- Toast 通知宿主（utils.js 自动创建，这里写死结构便于首屏前生效） -->
  <div id="dbp-toast-host" class="dbp-toast-host" aria-live="polite"></div>

  <!-- 确认框（showConfirm 用） -->
  <div class="modal-overlay" id="modal-confirm">
    <div class="modal-box modal-box-sm">
      <div class="modal-header">
        <span>请确认</span>
        <button class="modal-close" id="modal-confirm-close">&times;</button>
      </div>
      <div class="modal-body">
        <p id="modal-confirm-msg"></p>
      </div>
      <div class="modal-footer">
        <button class="btn" id="modal-confirm-cancel">取消</button>
        <button class="btn btn-primary" id="modal-confirm-ok">确定</button>
      </div>
    </div>
  </div>

  <!-- 框架脚本（顺序固定） -->
  <script src="./js/utils.js?v=0.9.33"></script>
  <script src="./js/plugin-loader.js?v=0.9.33"></script>
  <!-- 框架内置 404 组件：沉浸式 / 旧版极简，可在设置页切换 -->
  <script src="./js/notfound.js?v=0.9.33"></script>
  <script src="./js/router.js?v=0.9.33"></script>
  <script src="./js/app.js?v=0.9.33"></script>
  <script src="./js/settings.js?v=0.9.33"></script>
  <script src="./js/announcement.js?v=0.9.33"></script>
  <!-- 插件脚本不再预加载，由 plugin-loader.js 按需 fetch -->
  <script src="./js/init.js?v=0.9.33"></script>
</body>
</html>
